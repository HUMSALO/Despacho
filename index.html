<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Despacho v4</title>
<style>
:root{--primary:#1A73E8;--on-primary:#fff;--container:#E8F0FE;--on-container:#174EA6;--bg:#F1F3F4;--surface:#FFFFFF;--on-surface:#202124;--outline:#80868B;--div:#DADCE0;--bar:#FFFFFF;--snack:#323232;--on-snack:#FFFFFF;--sh:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15)}
@media (prefers-color-scheme:dark){:root{--primary:#8AB4F8;--on-primary:#202124;--container:#394457;--on-container:#D2E3FC;--bg:#202124;--surface:#292A2D;--on-surface:#E8EAED;--outline:#9AA0A6;--div:#3C4043;--bar:#292A2D;--snack:#E8EAED;--on-snack:#202124}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--on-surface);font-family:"Google Sans",Roboto,system-ui,sans-serif;text-transform:uppercase;
  padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
header{position:sticky;top:0;z-index:5;background:var(--bar);box-shadow:var(--sh);padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;font-size:20px;font-weight:500;display:flex;align-items:center;gap:10px}
header small{font-size:12px;font-weight:500;color:var(--on-container);background:var(--container);border-radius:4px;padding:2px 8px}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--surface);border-radius:8px;box-shadow:var(--sh);padding:16px;margin-bottom:16px}
.field{position:relative;margin-top:8px}
.field+.row+.field{margin-top:24px}
.field label{position:absolute;left:12px;top:-8px;padding:0 4px;font-size:12px;color:var(--primary);background:var(--surface)}
textarea{width:100%;min-height:56px;resize:none;overflow:hidden;display:block;background:transparent;color:var(--on-surface);
  border:1px solid var(--outline);border-radius:4px;padding:16px;font:inherit;font-size:16px;line-height:1.4;text-transform:uppercase}
.arrow{flex:none;width:32px;height:32px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
.arrow svg{width:22px;height:22px;fill:currentColor}
.arrow.abierto{transform:rotate(180deg)}
.arrow:active{background:var(--container)}
.apoi{padding:8px 0;border-bottom:1px solid var(--div)}
.apon{font-size:13px;font-weight:500;margin-bottom:6px}
.apoc{display:flex;gap:8px}
.apoc label.apot{flex:2.4}
.apoc label.apot input{text-align:left;text-transform:uppercase;padding:0 8px}
.apoc label{flex:1;font-size:11px;color:var(--primary);display:flex;flex-direction:column;gap:2px}
.apoin{width:100%;height:36px;box-sizing:border-box;border:1px solid var(--outline);border-radius:4px;background:transparent;color:var(--on-surface);font:inherit;font-size:16px;text-align:center}
textarea.col{height:56px!important;white-space:pre;overflow:hidden}
textarea:focus{outline:2px solid var(--primary);outline-offset:-2px;border-color:transparent}
.chk{position:absolute;right:12px;top:-11px;padding:0 6px;background:var(--surface);color:var(--primary);font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--primary)}
.row{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
button{border:0;border-radius:4px;height:36px;padding:0 16px;font:inherit;font-size:14px;font-weight:500;letter-spacing:.09em;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-transform:uppercase}
button:active{filter:brightness(.9)}
.tonal{background:var(--primary);color:var(--on-primary);box-shadow:0 1px 2px rgba(60,64,67,.3)}
.text{background:transparent;color:var(--primary);padding:0 8px}
svg{width:18px;height:18px;fill:currentColor}
.divider{display:flex;align-items:center;gap:12px;margin:24px 4px 16px;color:var(--primary);font-size:14px;font-weight:500;letter-spacing:.5px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--div)}
.snack{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 16px);max-width:400px;margin:auto;background:var(--snack);color:var(--on-snack);padding:14px 16px;border-radius:4px;font-size:14px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .2s}
.snack.on{opacity:1}
[hidden]{display:none!important}
#excel{max-height:240px;overflow:auto}
.mini{height:30px;padding:0 10px;font-size:12px}
.fw{display:flex;flex-direction:column;height:100vh;background:var(--surface)}
.fw .hd{padding:14px 16px;font-weight:500;font-size:15px;border-bottom:1px solid var(--div)}
.fw .bd{padding:4px 16px;overflow:auto;flex:1}
.fw .ft{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--div);justify-content:flex-end}
.fw .ft button:disabled{opacity:.4}
.erow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--div)}
.erow .l{flex:1;font-size:13px}
.erow .v{font-weight:700;min-width:36px;text-align:right}
.epag{font-weight:500;font-size:13px;color:var(--on-container);background:var(--container);border-radius:4px;padding:6px 10px;margin:14px 0 2px}
.rojo{color:#D93025;font-size:13px;font-weight:500;margin-top:14px}
</style>
</head>
<body>
<header>Despacho <small>v4.0</small></header>
<main>
  <section class="card">
    <div class="field"><label for="despachador">Despachador</label><textarea id="despachador" rows="1"></textarea></div>
    <div class="row" style="justify-content:flex-start"><button class="text" id="limpiarDesp"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg>Limpiar</button></div>
  </section>
  <section class="card">
    <div class="field"><label for="plantilla">Ingresa la plantilla</label><textarea id="plantilla" rows="1"></textarea></div>
    <div class="row" style="justify-content:space-between;align-items:center">
      <div style="display:flex;gap:8px"><button class="tonal" id="pegar"><svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0S9.6.84 9.18 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 18H5V4h2v3h10V4h2z"/></svg>Pegar</button><button class="text" id="limpiar"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg>Limpiar</button></div>
      <button class="arrow" id="plTog" aria-label="Mostrar u ocultar plantilla"><svg viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button>
    </div>
  </section>
  <section class="card" id="campos"></section>
  <div class="divider" id="divCierre">Cierre de incidente</div>
  <section class="card" id="cierre"></section>
  <section class="card" id="filaCard" hidden></section>
  <section class="card" id="eliteCard" hidden>
    <div class="row" style="margin-top:0;justify-content:flex-start"><button class="tonal" id="eliteBtn">Llenar élite</button></div>
    <div id="eliteVista"></div>
  </section>
  <section class="card" id="resultado" hidden></section>
</main>
<div class="snack" id="snack"></div>

<script>
var flot=null;
const flotOn=()=>!!flot&&!flot.closed;
const $=id=>(flotOn()&&flot.document.getElementById(id))||document.getElementById(id);
const ICON='<svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11z"/></svg>';
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const auto=t=>{if(t.classList.contains('col')){t.style.height='';return}t.style.height='auto';t.style.height=t.scrollHeight+2+'px'};
function snack(m){const s=$('snack');s.textContent=m;s.classList.add('on');clearTimeout(snack.t);snack.t=setTimeout(()=>s.classList.remove('on'),1800)}

function bloque(host,id,label){
  host.insertAdjacentHTML('beforeend',`<div class="field"><label for="${id}">${label}</label><textarea id="${id}" rows="1"></textarea></div>
  <div class="row"><button class="tonal" data-copy="${id}">${ICON}Copiar</button></div>`);
}
[['tipo','Tipo de incidente'],['detalle','Detalle de incidente'],['direccion','Dirección']].forEach(c=>bloque($('campos'),...c));
bloque($('cierre'),'narracion','Narración de hechos');
bloque($('filaCard'),'fila','Fila para Excel');
bloque($('resultado'),'salida','Resultado');
$('resultado').insertAdjacentHTML('beforeend','<div id="xlsWrap" style="margin-top:24px" hidden></div>');
bloque($('xlsWrap'),'excel','Columna para Excel');
$('xlsWrap').insertAdjacentHTML('beforeend','<div id="leyenda" style="font-size:12px;color:var(--on-surface);margin:10px 4px 0;white-space:pre-line"></div><div id="sinFila" style="font-size:12px;color:var(--primary);margin:10px 4px 0"></div>');
$('direccion').parentElement.insertAdjacentHTML('beforeend','<label class="chk"><input type="checkbox" id="dirPre" checked>Dirección predeterminada</label>');
let lastLugar='';
function dirRender(){
  const pre='SAN JOSE, SAN JOSE, CATEDRAL';
  const usa=$('dirPre').checked&&($('plantilla').value.trim()||lastLugar);
  $('direccion').value=usa?(lastLugar?pre+', '+lastLugar:pre):lastLugar;
  auto($('direccion'));
}
$('dirPre').addEventListener('change',dirRender);

/* ---------- Lector de plantillas ---------- */
const SIN={
  fecha:['FECHA'],
  hora:['HORA'],
  lugar:['LUGAR','LUGAR DEL DECOMISO','LUGAR DE DECOMISO','LUGAR DECOMISO','LUGAR HABITA','LUGR HABITA','LUGAR HABITACION','LUGAR EXACTO'],
  nombre:['IMPUTADO','NOMBRE IMPUTADO','NOMBRE DEL IMPUTADO','NOMBRE','NOMBRE COMPLETO'],
  cedula:['CEDULA','CEDULA IMPUTADO','CEDULA DEL IMPUTADO','CED'],
  cantidad:['CANTIDAD','TIPO DE DECOMISO','TIPO DE DROGA','DROGA'],
  delito:['TIPO Y DELITO','TIPO DELITO','DELITO'],
  tipoAp:['TIPO'],
  bebida:['BEBIDA ALCOHOLICA','BEBIDA','LICOR'],
  hechos:['DESCRIPCION DE LOS HECHOS','DESCRIPCION DE HECHOS','DESCRIPCION'],
  of1:['OFICIAL ACTUANTE','OFICIAL','OFICIAL RESPONSABLE','OFICIAL A CARGO','ACTUANTE'],
  of2:['OFICIAL ASISTENTE','ASISTENTE'],
  ofs:['OFICIALES','OFICIALES ACTUANTES','OFICIALES ACTUANTE Y ASISTENTE'],
  movil:['MOVIL','UNIDAD','PATRULLA','RECURSO'],
  _otro:['DECOMISO','CARACTERISTICAS','DIRECCION','NACIMIENTO','FECHA DE NACIMIENTO','FECHA NACIMIENTO','GRUPO','NACIONALIDAD','EXPEDIENTE','JUZGADO','CANTON','DISTRITO','CEDULA OFICIAL ACTUANTE','CEDULA OFICIAL ASISTENTE']
};
const MAPA={};for(const k in SIN)SIN[k].forEach(a=>MAPA[a]=k);
const DROGAS=['MARIHUANA','COCAINA','CRACK','HEROINA','METANFETAMINA','PASTA BASE','HACHIS','EXTASIS','LSD','ANFETAMINA'];

function limpiaLinea(l){
  return l.replace(/[\u2060\u200B\u200C\u200D\uFE0F]/g,'').replace(/\*/g,'')
    .replace(/^[\s•·\-–—_>]+/,'').replace(/^[^\p{L}\p{N}]+/u,'').trim();
}
function leer(texto){
  const v={};let act=null;
  for(const raw of texto.split(/\r?\n/)){
    const l=limpiaLinea(raw);if(!l)continue;
    const m=l.match(/^([^:：]{1,40}?)\s*[:：]\s*(.*)$/);
    let campo,resto;
    if(m&&MAPA[norm(m[1])]){campo=MAPA[norm(m[1])];resto=m[2]}
    else if(MAPA[norm(l)]){campo=MAPA[norm(l)];resto=''}
    else if(act==='hechos'||act==='delito'){v[act]+=(act==='hechos'?'\n':' ')+l;continue}
    else if(m){act=null;continue}
    else{if(act)v[act]=((v[act]||'')+(act==='ofs'?'\n':' ')+l).trim();continue}
    if(campo!=='_otro'&&v[campo]){act=null;continue}
    act=campo==='_otro'?null:campo;
    if(act){v[act]=v[act]||'';if(resto.trim())v[act]=resto.trim()}
  }
  return v;
}
function fmtFecha(s=''){
  const m=s.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/);if(!m)return s.trim();
  let y=m[3];if(y.length===2)y='20'+y;return m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0')+'-'+y;
}
function fmtHora(s=''){
  const m=s.match(/(\d{1,2})\s*[:.]\s*(\d{2})\s*([AP])?\.?\s*M?/i);if(!m)return s.trim();
  let h=+m[1];const ap=(m[3]||'').toUpperCase();
  if(ap==='P'&&h<12)h+=12;if(ap==='A'&&h===12)h=0;
  return String(h).padStart(2,'0')+':'+m[2];
}
function fmtCantidad(s=''){
  let t=norm(s).replace(/\bDE APARENTE DROGA\b|\bAPARENTE DROGA\b|\bAPARENTE\b|\bDROGA\b/g,' ').replace(/\s+/g,' ').trim();
  const d=DROGAS.find(x=>t.includes(x));
  if(!d)return t;
  let item=t.replace(d,' ').replace(/\s+/g,' ').trim().replace(/\bDE$/,'').replace(/^DE\b/,'').trim();
  return item?item+' DE '+d:d;
}
function armar(){
  const txt=$('plantilla').value;
  const nT=norm(txt),circ=/PLANTILLA CIRCULAR/.test(nT),nuevo=/DELEGACIONES/.test(nT)&&/ABORDAJES/.test(nT),cdc=!nuevo&&/CORTE DE CONTROL/.test(nT),eli=!circ&&(/ELITE/.test(nT)||nuevo);
  const esp=nuevo&&!circ?'CORTE ELITE':cdc?'CORTE DE CONTROL':circ?'PLANTILLA CIRCULAR':eli?'CORTE ELITE':'';
  eliteRender(eli?txt:null);
  vista(txt.trim()?esp:null);
  if(esp){lastV=null;filaRender();
    $('salida').value=esp==='CORTE ELITE'?'':filtrar(txt);auto($('salida'));
    const x=esp==='PLANTILLA CIRCULAR'?excel(txt):null;
    $('xlsWrap').hidden=!x;
    if(x){$('excel').value=x.col;auto($('excel'));$('leyenda').textContent=x.fil.length?'LEYENDA (FILA DEL EXCEL: CANTIDAD)\n'+x.fil.join('\n'):'';$('sinFila').textContent=x.sin.length?'SIN FILA EN EXCEL: '+x.sin.join(' | '):''}
    return}
  const v=leer(txt);
  const up=s=>(s||'').toUpperCase().replace(/\s+/g,' ').trim();
  const lugar=up(v.lugar),nom=up(v.nombre);
  const ced=(v.cedula||'').replace(/[^\dA-Za-z]/g,'').toUpperCase();
  const f=fmtFecha(v.fecha),h=fmtHora(v.hora);
  const apre=/APREHENSION/.test(norm(txt))||!!(v.delito||v.hechos);
  const cant=apre?'':fmtCantidad(v.cantidad);
  /* Plantillas de incidente: contravención por licor y armas */
  const tn=norm(v.tipoAp||'');
  const esLicor=!apre&&(!!v.bebida||/LICOR|BEBIDA/.test(tn));
  const esArma=!apre&&!esLicor&&/\bARMAS?\b/.test(tn);
  const esDroga=!apre&&!esLicor&&!esArma&&(!!cant||/DROGA|MARIHUANA|COCAINA|CRACK|HEROINA/.test(norm(txt)));
  const base=[];if(nom)base.push(nom);if(ced)base.push('CEDULA '+ced);
  let tipo='',det='',nar='';
  if(apre){
    const t=up(v.tipoAp),d=up(v.delito);
    tipo=t&&d&&!d.startsWith(t)?t+': '+d:(d||t);
    det=base.join(' ');
    nar=(v.hechos||'').split(/\n/).map(x=>x.trim().toUpperCase()).filter(Boolean).join('\n\n');
  }else{
    if(esLicor)tipo=up(v.tipoAp)||'CONTRAVENCION POR CONSUMO DE LICOR EN VIA PUBLICA';
    else if(esArma)tipo='DECOMISO DE '+(/BLANCA/.test(tn)?'ARMA BLANCA':'ARMA');
    else if(esDroga)tipo='DECOMISO DE DROGA';
    const p=[...base];
    if(esLicor)p.push('CONSUMIENDO '+(up(v.bebida)||'BEBIDA ALCOHOLICA'));
    else if(esArma)p.push('PORTA '+up(v.tipoAp));
    else if(cant)p.push('PORTA '+cant);
    det=p.join(' ');
    const q=[...p];if(lugar)q.push('ESTO EN '+lugar);
    nar=q.join(' ');
    if(h||f)nar+=(nar?'. ':'')+'AL SER LAS '+(h||'')+' HORAS DEL '+(f||'');
  }
  $('tipo').value=tipo;
  $('detalle').value=det;
  lastLugar=lugar;dirRender();
  $('narracion').value=nar;
  ['tipo','detalle','narracion'].forEach(i=>auto($(i)));
  lastV=txt.trim()?v:null;filaRender();
}

/* ---------- Fila para Excel (llenado de incidente): 9 columnas separadas por tabulador ---------- */
let lastV=null;
function sitDroga(c){
  const t=fmtCantidad(c||'');if(!t)return'';
  const m=t.match(/^(.*) DE (MARIHUANA|COCAINA|CRACK|HEROINA|METANFETAMINA|PASTA BASE|HACHIS|EXTASIS|LSD|ANFETAMINA)$/);
  if(m)return m[1]+' DE APARENTE DROGA '+m[2];
  return DROGAS.includes(t)?'APARENTE DROGA '+t:t;
}
function filaRender(){
  const card=$('filaCard');
  if(!lastV){card.hidden=true;$('fila').value='';return}
  const v=lastV,up=s=>(s||'').toUpperCase().replace(/\s+/g,' ').trim();
  const f=fmtFecha(v.fecha).replace(/-/g,'/'),h=fmtHora(v.hora);
  const nom=up(v.nombre),ced=(v.cedula||'').replace(/[^\dA-Za-z]/g,'').toUpperCase();
  const mov=(String(v.movil||'').match(/\d+/)||[''])[0];
  const of=v.ofs?v.ofs.split('\n').map(up).filter(Boolean).join('/'):[up(v.of1),up(v.of2)].filter(Boolean).join('/');
  let sit;
  if(/^DECOMISO DE DROGA/.test($('tipo').value.trim())){
    const a=['SE LE DECOMISA A'];if(nom)a.push(nom);if(ced)a.push('CEDULA '+ced);
    const c=sitDroga(v.cantidad);if(c)a.push(c);
    sit=a.join(' ');
  }else sit=$('detalle').value.trim();
  const cols=[f,h?h+':00':'','RECORRIDO',$('tipo').value.trim(),mov,of,up(v.lugar),sit,$('despachador').value.trim()];
  $('fila').value=cols.map(x=>String(x).replace(/[\t\r\n]+/g,' ').toUpperCase()).join('\t');
  auto($('fila'));card.hidden=false;
}

/* ---------- Corte ÉLITE: formulario de 17 páginas (solo páginas 3 y 6 a 16 con datos) ---------- */
const norL=s=>norm(sinAst(s)).replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const F=(n,re,k,no)=>({n,re,k,no});
const veh=(pre,tipo)=>[['DECOMISADO OIJ O POR DENUNCIA ROBO',/OIJ|ROBO/],['DECOMISADO POLICÍA DE TRÁNSITO',/TRANSITO/,/BOLETA/],['DECOMISADO "PIQUES"',/PIQUE/],['RECUPERADO (HALLAZGO)',/RECUPERAD|HALLAZGO/],['CON BOLETAS REALIZADAS POR TRÁNSITO',/BOLETA/,/PLACA/],['PLACAS DECOMISADAS',/PLACA/]]
  .map(([s,re,no])=>F(pre+' '+s,[tipo,re],null,[].concat(no||[],/INVESTIG/)));
const ELITE=[
 {pag:6,c:'DELITOS',t:'APREHENSIONES POR DELITO',f:[
  F('DELITOS CONTRA LA VIDA',/CONTRA LA VIDA/),
  F('DELITOS CONTRA LA PROPIEDAD',/DELITOS? .*PROPIEDAD/,null,/CONTRAVENCION|PATRIMONIO/),
  F('DELITOS SEXUALES',/SEXUALES?/),
  F('DELITO A LEY DE ARMAS Y EXPLOSIVOS',/LEY DE ARMAS|ARMAS Y EXPLOSIVOS/),
  F('DELITOS FISCALES O CONTRA LA HACIENDA PÚBLICA',/FISCALES|HACIENDA/),
  F('DELITOS VARIOS',/DELITOS? VARIOS|^VARIOS$/),
  F('PORTACIÓN ILEGAL DE ARMA FUEGO',/PORTACION ILEGAL/),
  F('CAPTURA PENAL',/CAPTURA PENAL/),
  F('TRANSPORTE DE DROGAS',/TRANSPORTE DE DROGA/),
  F('ORDEN DE PRESENTACIÓN A INSTANCIA JUDICIAL',/ORDEN(ES)? DE PRESENTACION/),
  F('FLAGRANCIAS',/FLAGRANCIA/),
  F('APREHENDIDOS CON BRAZALETE',/BRAZALETE/),
  F('RESISTENCIA/DESOBEDIENCIA',/RESISTENCIA|DESOBEDIENCIA/)]},
 {pag:7,c:'CONTRAVENCIÓN',t:'APREHENSIONES POR CONTRAVENCIONES',f:[
  F('CONTRAVENCIÓN CONTRA LAS PERSONAS',/CONTRA LAS PERSONAS/),
  F('CONTRAVENCIÓN CONTRA LA PROPIEDAD Y EL PATRIMONIO',/PATRIMONIO|CONTRAVENCION.*PROPIEDAD/),
  F('CONTRAVENCIÓN CONTRA EL ORDEN PÚBLICO',/ORDEN PUBLICO/),
  F('CONTRAVENCIÓN CONTRA LA BUENAS COSTUMBRES',/BUENAS COSTUMBRES/),
  F('CONTRAVENCIÓN CONTRA INVIOLABILIDAD TERRENOS',/INVIOLAB/),
  F('CONTRAVENCIÓN CONTRA SEGURIDAD PÚBLICA',/SEGURIDAD PUBLICA/),

function eliteRender(txt){

/* La ventana aparte muestra todas las páginas en vertical, igual que en la app: sin Siguiente */

/* Los datos del élite se abren en una ventana/pestaña aparte del navegador (flotante siempre que el navegador lo permita) */

/* ---------- Corte de control y plantilla circular: solo lo que tiene datos ---------- */
const DIV=/^[━─—_=\-]{5,}$/;
const sinAst=s=>s.replace(/\*/g,'').replace(/[\u2060\u200B\u200C\u200D\uFE0F]/g,'');
const vacio=v=>{v=sinAst(v).trim();return !v||/^\(\s*\)$/.test(v)||/^[-–]+$/.test(v)||/^0+([.,]0+)?$/.test(v)};
function etiqueta(l){
  const m=sinAst(l).trim().match(/^([^:：]{1,60}?)\s*[:：]\s*(.*)$/);
  if(m)return{val:m[2]};
  if(/^\*[^*]+\*$/.test(l.trim()))return{val:''};
  return null;
}
function partes(l){
  const p=l.trim().split(/\s{3,}/);
  return p.length>1&&p.every(x=>etiqueta(x))?p:[l.trim()];
}
function bloques(lines){
  const out=[];let cur=null,blank=false;
  for(const raw of lines){
    const l=raw.trim();
    if(!l){blank=true;continue}
    const ps=partes(l);
    if(etiqueta(ps[0])){cur={ps:ps.map(p=>({t:p,v:etiqueta(p).val})),body:[],gap:false};out.push(cur)}
    else if(cur){if(!cur.body.length&&blank)cur.gap=true;cur.body.push(l)}
    else out.push({ps:[{t:l,v:'x'}],body:[],gap:false});
    blank=false;
  }
  return out;
}
function textoBloque(b){
  const k=b.ps.filter((p,i)=>!vacio(p.v)||(i===b.ps.length-1&&b.body.length));
  if(!k.length)return'';
  const cab=k.map(p=>p.t).join('   ');
  return b.body.length?cab+(b.gap?'\n\n':'\n')+b.body.join('\n'):cab;
}
function filtrar(txt){
  const secs=[[]];let divOrig='';
  for(const l of txt.replace(/\r/g,'').split('\n')){
    if(DIV.test(l.trim())){divOrig=divOrig||l.trim();secs.push([])}
    else secs[secs.length-1].push(l.replace(/\s+$/,''));
  }
  const hasDiv=secs.length>1,sep=hasDiv?'\n':'\n\n',res=[];
  secs.forEach((s,i)=>{
    if(i===0){
      let k=s.findIndex(l=>/^([^:：]{1,60}?)\s*[:：]/.test(sinAst(l).trim()));
      if(k<0)k=s.length;
      const pre=s.slice(0,k).map(l=>l.trim()).filter(Boolean).join(hasDiv?'\n':'\n\n');
      const t=[pre,bloques(s.slice(k)).map(textoBloque).filter(Boolean).join(sep)].filter(Boolean).join('\n\n');
      if(t)res.push(t);
    }else{
      const hi=s.findIndex(l=>l.trim());if(hi<0)return;
      const bl=bloques(s.slice(hi+1)).map(textoBloque).filter(Boolean);
      if(bl.length)res.push(s[hi].trim()+(s[hi+1]!==undefined&&!s[hi+1].trim()?'\n\n':'\n')+bl.join('\n'));
    }
  });
  return res.join('\n'+(divOrig||'━━━━━━━━━━━━━━━')+'\n');
}
/* Circular -> columna de valores alineada a las filas del Excel (vacío = salta la fila) */
const FILAS=86,XLS={'POR COMISION DE DELITOS':6,'APREHENSION POR MIGRACION':11,'ARMAS BLANCAS':12,'PERSONAS INVESTIGADAS':77,'VEHICULOS INVESTIGADOS':78,'MOTOS INVESTIGADAS':79,'FURGONES CAMIONES INVESTIGADOS':80,'AGENTES DE SEGURIDAD INVESTIGADOS':81,'ARMAS DE FUEGO INVESTIGADAS':82,'LOCALES COMERCIALES CLAUSURADOS':83,'LOCALES HABITUACIONALES CLAUSURADOS':84,'CONTROLES DE CARRETERA':85};
const SIN_FILA=['APREHENSIONES','DECOMISOS','POR ORDEN JUDICIAL','POR FLAGRANCIA'];
/* Títulos de las 86 filas de la tabla INDICADORES (leyenda de la columna) */
const ETQ=["Aprehensiones por contravención – Contra las personas","Aprehensiones por contravención – Contra la propiedad y el patrimonio","Aprehensiones por contravención – Contra el orden público","Aprehensiones por contravención – Contra las buenas costumbres","Aprehensiones por contravención – Contra inviolab. terrenos","Aprehensiones por contravención – Contra seguridad pública","Detenidos por comisión de delitos","Aprehendidos por migración – Residente","Aprehendidos por migración – Citas","Aprehendidos por migración – Decomisos de pasaporte","Aprehendidos por migración – Rechazos","Aprehendidos por migración – Aprehensiones por migración","Decomisos de armas blancas – Punzocortantes","Decomisos de armas de fuego – Pistola balines","Armas no letales – Pistola balas de goma","Armas no letales – Rifle de copas","Armas no letales – Armas de imitación","Armas de fuego – Pistola","Armas de fuego – Revólver","Armas de fuego – Arma larga","Armas de fuego – Escopeta","Armas de fuego – Subametralladora","Armas de fuego – Hechizas","Munición – Balas","Munición – Cargadores","Pólvora – Fuegos artificiales","Pólvora – Otro tipo","Decomiso de automóviles – Por OIJ o denuncia de robo","Decomiso de automóviles – Por policía de tránsito","Decomiso de automóviles – Por piques","Decomiso de automóviles – Recuperado (hallazgo)","Decomiso de automóviles – Solo boletas de tránsito","Decomiso de automóviles – Boletas y placas decomisadas","Decomiso de motocicletas – Por OIJ o denuncia de robo","Decomiso de motocicletas – Por policía de tránsito","Decomiso de motocicletas – Por piques","Decomiso de motocicletas – Recuperado (hallazgo)","Decomiso de motocicletas – Solo boletas de tránsito","Decomiso de motocicletas – Boletas y placas decomisadas","Decomiso de marihuana – Gramos","Decomiso de marihuana – Kilos","Decomiso de marihuana – Cigarros","Decomiso de marihuana – Puchos","Decomiso de marihuana – Tocolas","Decomiso de marihuana – Plantas","Decomiso de marihuana – Semillas","Decomiso de cocaína – Gramos","Decomiso de cocaína – Kilos","Decomiso de cocaína – Puntas","Decomiso de crack – Gramos","Decomiso de crack – Piedras","Decomiso de otras drogas – Éxtasis","Decomiso de otras drogas – Heroína","Decomiso de otras drogas – Anfetaminas","Decomiso de otras drogas – Otras","Decomiso de animales – Bovinos","Decomiso de animales – Porcinos","Decomiso de animales – Equinos","Decomiso de animales – Aves","Decomiso de animales – Otros (reptiles y anfibios)","Decomiso de licores – Litros","Decomiso de licores – Pachas","Decomiso de licores – Botellas","Decomiso de licores – Latas","Decomiso de dinero – Colones","Decomiso de dinero – Dólares","Decomiso de dinero – Euros","Decomiso de dinero – Otros","Decomiso de alimentos – Pescado kg","Decomiso de alimentos – Carne kg","Decomiso de alimentos – Queso kg","Decomiso de alimentos – Granos","Decomiso de medicamentos – Pastillas","Decomiso de medicamentos – Cremas","Decomiso de medicamentos – Jarabes","Decomiso de madera – Tucas/trozos","Decomiso de mercadería – Ropa/perfumes/zapatos/otros","Investigados – Personas","Investigados – Vehículos","Investigados – Motos","Investigados – Furgones/camiones","Investigados – Agentes de seguridad","Investigados – Armas de fuego","Locales – Comerciales clausurados","Locales – Habitacionales clausurados","Controles de carretera"];
/* Drogas: filas del Excel por tipo y unidad (gramos/kilos sin droga indicada = marihuana) */
const DR={MAR:{GRAMOS:39,KILOS:40,CIGARROS:41,PUCHOS:42,TOCOLAS:43,PLANTAS:44,SEMILLAS:45},COC:{GRAMOS:46,KILOS:47,PUNTAS:48},CRK:{GRAMOS:49,PIEDRAS:50},OTR:{EXTASIS:51,HEROINA:52,ANFETAMINAS:53}};
function drogas(lines,col){
  const sobra=[],re=/(\d+(?:[.,]\d+)?)\s*(GRAMOS?|GRS?\b|KILOS?|KGS?\b|CIGARROS?|PUCHOS?|TOCOLAS?|PLANTAS?|SEMILLAS?|PUNTAS?|PIEDRAS?|EXTASIS|HEROINA|ANFETAMINAS?)/g;
  for(const raw of lines){
    const l=norm(sinAst(raw));if(!l||vacio(l))continue;
    let hit=false,m;re.lastIndex=0;
    while((m=re.exec(l))){
      let u=m[2].replace(/^GRS?$/,'GRAMOS').replace(/^KGS?$/,'KILOS').replace(/S$/,'')+'S';
      if(u==='EXTASIS')u='EXTASIS';if(u==='HEROINAS')u='HEROINA';
      const d=/COCAINA/.test(l)?'COC':/CRACK/.test(l)?'CRK':/HEROINA|EXTASIS|ANFETAMINA/.test(u+l)&&(u==='HEROINA'||u==='EXTASIS'||u==='ANFETAMINAS')?'OTR':'MAR';
      const grp=u==='PUNTAS'?'COC':u==='PIEDRAS'?'CRK':(u==='EXTASIS'||u==='HEROINA'||u==='ANFETAMINAS')?'OTR':d;
      const r=DR[grp]&&DR[grp][u];if(r==null)continue;
      col[r]=String(Math.round(((parseFloat(col[r])||0)+parseFloat(m[1].replace(',','.')))*1000)/1000);hit=true;
    }
    if(!hit)sobra.push(raw.trim());
  }
  return sobra;
}
function excel(txt){
  const col=Array(FILAS).fill('0'),sin=[];
  for(const b of bloques(txt.replace(/\r/g,'').split('\n'))){
    b.ps.forEach((p,i)=>{
      const e=etiqueta(p.t);if(!e)return;
      const k=norm(sinAst(p.t).split(/[:：]/)[0]).replace(/[^A-Z]+/g,' ').trim();
      const v=sinAst(e.val).trim(),cuerpo=i===b.ps.length-1?b.body:[];
      if(vacio(v)&&!cuerpo.length)return;
      if(k in XLS){col[XLS[k]]=/^\d+$/.test(v)?String(+v):v;return}
      if(k==='DECOMISOS DE DROGAS'){const so=drogas([v,...cuerpo],col);if(so.length)sin.push(k+': '+so.join(' / '));return}
      if(SIN_FILA.includes(k))return;
      sin.push(k+(v?': '+v:'')+(cuerpo.length?(v?' / ':': ')+cuerpo.join(' / '):''));
    });
  }
  const fil=col.map((v,i)=>v&&v!=='0'?ETQ[i]+': '+v:'').filter(Boolean);
  /* 11 filas de encabezado del Excel (ministerio ... INDICADORES) quedan en blanco: 11 + 86 = 97 filas */
  return{col:'\n'.repeat(11)+col.join('\n'),sin,fil};
}
function vista(esp){
  const ninguno=esp===null;
  ['campos','cierre','divCierre'].forEach(i=>$(i).hidden=ninguno||!!esp);
  $('resultado').hidden=ninguno||!esp||esp==='CORTE ELITE';
  if(esp)document.querySelector('label[for="salida"]').textContent=esp;
}

/* ---------- Eventos ---------- */
function mayus(el){const a=el.selectionStart,b=el.selectionEnd;const u=el.value.toUpperCase();if(u!==el.value){el.value=u;try{el.setSelectionRange(a,b)}catch(e){}}}
const pl=$('plantilla');
function plCol(c){pl.classList.toggle('col',c);if(c)pl.scrollTop=0;$('plTog').classList.toggle('abierto',!c);auto(pl)}
function plSync(){}
$('plTog').onclick=()=>plCol(!pl.classList.contains('col'));
pl.addEventListener('input',plSync);
pl.addEventListener('paste',()=>setTimeout(()=>{plCol(true);plSync()},0));
document.addEventListener('input',e=>{
  const t=e.target;if(t.tagName!=='TEXTAREA')return;
  mayus(t);auto(t);if(t===$('despachador')){try{localStorage.setItem('despachador',t.value)}catch(e){}}if(t===$('despachador')){filaRender();if(eliteTxt)eliteRender(eliteTxt)}if(t===pl)armar();
});
function onInputApo(e){
  const t=e.target;if(!t.classList||!t.classList.contains('apoin'))return;
  const n=t.dataset.n,k=+t.dataset.k,mem=apoyoLoad();
  if(k<3)t.value=t.value.replace(/\D/g,'').slice(0,4);else t.value=t.value.toUpperCase().slice(0,80);
  if(!mem[n])mem[n]=[0,0,0,''];mem[n][k]=k<3?(parseInt(t.value,10)||0):t.value;apoyoSave(mem);
  const docs=flotOn()?[document,flot.document]:[document];
  docs.forEach(D=>D.querySelectorAll('.apoin').forEach(o=>{if(o!==t&&o.dataset.n===n&&+o.dataset.k===k)o.value=t.value}));
  const p=eliteSeq.find(x=>x.apoyo);if(p){p.rows=apoyoRows(p.nom);docs.forEach(D=>D.querySelectorAll('.apoTot').forEach(c=>{c.innerHTML=eliteFilas(p.rows)}))}
}
document.addEventListener('input',onInputApo);
async function copiar(id){
  const t=$(id).value;if(!t.trim()){snack('Nada que copiar');return}
  try{await navigator.clipboard.writeText(t)}catch(e){const el=$(id);el.select();document.execCommand('copy')}
  snack('Copiado');
}
function onClickCopiar(e){const b=e.target.closest('[data-copy]');if(b)copiar(b.dataset.copy);const c=e.target.closest('[data-cp]');if(c)copiarTexto(c.dataset.cp)}
document.addEventListener('click',onClickCopiar);
async function copiarTexto(t){
  if(!t||t==='—'){snack('Nada que copiar');return}
  const W=flotOn()?flot:window;
  try{await W.navigator.clipboard.writeText(t)}catch(e){const D=W.document,el=D.createElement('textarea');el.value=t;D.body.appendChild(el);el.select();D.execCommand('copy');D.body.removeChild(el)}
  snack('Copiado');
}
$('eliteBtn').onclick=eliteAbrir;
$('pegar').onclick=async()=>{
  try{const t=await navigator.clipboard.readText();pl.value=t.toUpperCase();armar();plCol(true);plSync();snack('Pegado')}
  catch(e){pl.focus();snack('Permite el acceso al portapapeles o pega manualmente')}
};
$('limpiarDesp').onclick=()=>{
  const d=$('despachador');d.value='';try{localStorage.removeItem('despachador')}catch(e){}
  auto(d);filaRender();if(eliteTxt)eliteRender(eliteTxt);snack('Despachador limpio');
};
$('limpiar').onclick=()=>{
  pl.value='';plCol(true);plSync();lastLugar='';lastV=null;eliteRender(null);$('fila').value='';$('filaCard').hidden=true;$('salida').value='';$('excel').value='';vista(null);['tipo','detalle','direccion','narracion'].forEach(i=>$(i).value='');
  document.querySelectorAll('textarea').forEach(auto);snack('Plantilla limpia');
};
/* Despachador: se llena una vez y queda guardado; Limpiar no lo borra, solo cambia si se edita o se borra aquí */
try{$('despachador').value=localStorage.getItem('despachador')||''}catch(e){}
document.querySelectorAll('textarea').forEach(auto);
plCol(true);
vista(null);
</script>
