<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Despacho v8</title>
<style>
:root{--primary:#1A73E8;--on-primary:#fff;--container:#E8F0FE;--on-container:#174EA6;--bg:#F1F3F4;--surface:#FFFFFF;--on-surface:#202124;--outline:#80868B;--div:#DADCE0;--bar:#FFFFFF;--danger:#C5221F;--warn-bg:#FEF7E0;--warn-fg:#7A4F01;--snack:#323232;--on-snack:#FFFFFF;--sh:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15)}
@media (prefers-color-scheme:dark){:root{--primary:#8AB4F8;--on-primary:#202124;--container:#2F4268;--on-container:#D2E3FC;--bg:#202124;--surface:#292A2D;--on-surface:#E8EAED;--outline:#A8AEB5;--div:#4A4D52;--danger:#F28B82;--warn-bg:#4A3B12;--warn-fg:#FDE293;--bar:#292A2D;--snack:#E8EAED;--on-snack:#202124}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--on-surface);font-family:"Google Sans",Roboto,system-ui,sans-serif;
  padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
header{position:sticky;top:0;z-index:5;background:var(--bar);box-shadow:var(--sh);padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;font-size:20px;font-weight:500;display:flex;align-items:center;gap:10px}
header small{font-size:12px;font-weight:500;color:var(--on-container);background:var(--container);border-radius:4px;padding:2px 8px}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--surface);border-radius:8px;box-shadow:var(--sh);padding:16px;margin-bottom:16px}
.field{position:relative;margin-top:8px}
.field+.row+.field{margin-top:24px}
.field label{position:absolute;left:12px;top:-8px;padding:0 4px;font-size:12px;color:var(--primary);background:var(--surface)}
textarea{width:100%;min-height:56px;resize:none;overflow:hidden;display:block;background:transparent;color:var(--on-surface);
  border:1px solid var(--outline);border-radius:4px;padding:16px;font:inherit;font-size:16px;line-height:1.4;text-transform:uppercase}
.arrow{flex:none;width:32px;height:32px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
.arrow svg{width:22px;height:22px;fill:currentColor}
.arrow.abierto{transform:rotate(180deg)}
.arrow:active{background:var(--container)}
.apoi{padding:8px 0;border-bottom:1px solid var(--div)}
.apon{font-size:13px;font-weight:500;margin-bottom:6px}
.apoc{display:flex;gap:8px}
.apoc label.apot{flex:2.4}
.apoc label.apot input{text-align:left;text-transform:uppercase;padding:0 8px}
.apoc label{flex:1;font-size:11px;color:var(--primary);display:flex;flex-direction:column;gap:2px}
.apoin{width:100%;height:36px;box-sizing:border-box;border:1px solid var(--outline);border-radius:4px;background:transparent;color:var(--on-surface);font:inherit;font-size:16px;text-align:center}
textarea.col{height:56px!important;white-space:pre;overflow:hidden}
.xgrid{max-height:360px;overflow:auto;border:1px solid var(--outline);border-radius:4px;padding:10px 6px 6px}
.xt{border-collapse:collapse;width:100%;font-size:12px}
.xt td{border:1px solid var(--div);padding:4px 6px;color:var(--on-surface)}
.xg{font-weight:500;background:var(--container);color:var(--on-container)!important;vertical-align:middle}
.xn{text-align:right;min-width:44px;font-weight:700;outline:none}
.xn.nz{color:var(--primary)!important}
.xn:focus{background:var(--container)}
.chip{height:32px;padding:0 12px;border:1px solid var(--outline);background:transparent;color:var(--on-surface);border-radius:16px;letter-spacing:0;font-size:14px;font-weight:500}
.chip.sel{background:var(--primary);color:var(--on-primary);border-color:transparent}
.chip .x{margin-left:8px;opacity:.7;font-size:16px;line-height:1}
.xt th{border:1px solid var(--div);padding:4px 6px;background:var(--container);color:var(--on-container);font-weight:500;text-align:left;white-space:nowrap;position:sticky;top:-10px}
#filaGrid td{text-transform:uppercase;min-width:84px;outline:none;vertical-align:top}
#filaGrid td:focus{background:var(--container)}
#filaGrid td:nth-child(6){min-width:150px}
#filaGrid td:nth-child(8){min-width:260px}
textarea:focus{outline:2px solid var(--primary);outline-offset:-2px;border-color:transparent}
.chk{position:absolute;right:12px;top:-11px;padding:0 6px;background:var(--surface);color:var(--primary);font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--primary)}
.row{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
button{border:0;border-radius:4px;height:36px;padding:0 16px;font:inherit;font-size:14px;font-weight:500;letter-spacing:.02em;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
button:active{filter:brightness(.9)}
.tonal{background:var(--primary);color:var(--on-primary);box-shadow:0 1px 2px rgba(60,64,67,.3)}
.text{background:transparent;color:var(--primary);padding:0 8px}
svg{width:18px;height:18px;fill:currentColor}
.divider{display:flex;align-items:center;gap:12px;margin:24px 4px 16px;color:var(--primary);font-size:14px;font-weight:500;letter-spacing:.5px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--div)}
.snack{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 16px);max-width:400px;margin:auto;background:var(--snack);color:var(--on-snack);padding:14px 16px;border-radius:4px;font-size:14px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .2s}
.snack.on{opacity:1}
[hidden]{display:none!important}
#excel{max-height:240px;overflow:auto;white-space:pre;text-transform:none;tab-size:4;font-size:13px}
.mini{height:30px;padding:0 10px;font-size:12px}
.fw{display:flex;flex-direction:column;height:100vh;background:var(--surface)}
.fw .hd{padding:14px 16px;font-weight:500;font-size:15px;border-bottom:1px solid var(--div)}
.fw .bd{padding:4px 16px;overflow:auto;flex:1}
.fw .ft{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--div);justify-content:flex-end}
.fw .ft button:disabled{opacity:.4}
.erow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--div)}
.erow .l{flex:1;font-size:13px}
.erow .v{font-weight:700;min-width:36px;text-align:right}
.epag{font-weight:500;font-size:13px;color:var(--on-container);background:var(--container);border-radius:4px;padding:6px 10px;margin:14px 0 2px}
.rojo{color:#D93025;font-size:13px;font-weight:500;margin-top:14px}

.xn{font-size:15px}
.xn:not(.nz){opacity:.4;font-weight:500}
.tonal{height:38px;padding:0 18px}
.tonal.mini{height:30px;padding:0 10px}
#limpiar,#limpiarDesp{color:var(--danger)}
.rojo{color:var(--danger)}
.aviso{background:var(--warn-bg);color:var(--warn-fg);border-left:4px solid var(--warn-fg);border-radius:4px;padding:10px 12px;margin:10px 0 0;font-size:13px;line-height:1.4;white-space:pre-line}
#plLista{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.plt{font-size:12px;font-weight:500;color:var(--on-surface);margin:0 2px}
.plc{display:flex;align-items:center;gap:8px;border:1px solid var(--div);border-radius:8px;padding:6px 6px 6px 10px;background:var(--bg)}
.pln{font-weight:700;font-size:13px;color:var(--primary);min-width:22px}
.plp{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plb{font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px;white-space:nowrap;border:1px solid transparent}
.tp-CIRC{background:rgba(26,115,232,.16);border-color:rgba(26,115,232,.5)}
.tp-ELI{background:rgba(30,142,62,.16);border-color:rgba(30,142,62,.5)}
.tp-INC{background:rgba(249,171,0,.18);border-color:rgba(249,171,0,.6)}
.tp-APR{background:rgba(217,48,37,.14);border-color:rgba(217,48,37,.5)}
.tp-OTR{background:rgba(128,134,139,.18);border-color:rgba(128,134,139,.5)}
.plx{flex:none;width:30px;height:30px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--danger);font-size:18px;justify-content:center}
.plx:active{background:var(--container)}

.acc{display:flex;gap:8px;align-items:center;margin-top:12px}
.ab{flex:1;flex-direction:column;justify-content:center;gap:4px;height:58px;padding:0 4px;border-radius:14px;background:var(--container);color:var(--on-container);font-size:12px;letter-spacing:.02em}
.ab svg{width:22px;height:22px}
.ab.pri{background:var(--primary);color:var(--on-primary)}
.ab.dng{background:transparent;border:1px solid var(--div);color:var(--danger)}
.plc{cursor:pointer;transition:background .15s,border-color .15s}
.plc.grp{border-left:4px solid var(--primary)}
.plc.sel{border-color:var(--primary);background:var(--container)}
.plabrir{font-size:12px;color:var(--primary);flex:none}
#plantilla:not(.col){max-height:320px;overflow:auto}

/* ===== Mejoras estéticas v8.1 ===== */
:root{--sh:0 1px 2px rgba(60,64,67,.18),0 2px 8px 1px rgba(60,64,67,.08)}
/* 5. Espaciado, sombras y bordes */
main{padding:18px 16px}
.card{padding:18px;margin-bottom:20px;border-radius:12px}
textarea,.apoin{border-width:1.5px}
#recurso{border-width:1.5px!important}
.field{margin-top:12px}
.divider{margin:28px 4px 18px}
/* 6. Barra superior */
header{gap:10px}
#hdInfo{margin-left:auto;display:flex;align-items:center;gap:6px;min-width:0}
#hdInfo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
#hdInfo .hdd{font-size:12px;font-weight:500;color:var(--on-container);background:var(--container);border-radius:12px;padding:3px 10px}
/* 1. Alerta amarilla */
.aviso{white-space:normal;padding:12px 14px;border-left-width:5px;border-radius:6px}
.aviso .avt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:6px}
.aviso .avt svg{width:20px;height:20px;flex:none}
.aviso ul{margin:0;padding-left:20px}
.aviso li{margin:6px 0;line-height:1.45}
/* 2. Tabla del Excel */
.xt td,.xt th{padding:9px 8px}
.xt td{line-height:1.3}
.xt tr.rz td:not(.xg){background:rgba(26,115,232,.12)}
.xt tr.rz td:not(.xg):not(.xn){font-weight:500}
.xn{min-width:52px}
.xn:not(.nz){opacity:.55}
/* 3. Jerarquía de botones: sólido solo en la acción principal */
.tonal.mini{background:transparent;color:var(--primary);border:1.5px solid var(--outline);box-shadow:none}
.tonal.mini:active{background:var(--container)}
.ab.dng{border-color:var(--outline)}
/* 4. Tarjetas de plantillas */
.plc{border-left:5px solid var(--outline);padding:8px 8px 8px 10px;border-radius:10px}
.plc.tc-CIRC{border-left-color:#1A73E8}
.plc.tc-ELI{border-left-color:#1E8E3E}
.plc.tc-INC{border-left-color:#F9AB00}
.plc.tc-APR{border-left-color:#D93025}
.plc.tc-OTR{border-left-color:#80868B}
.plc.grp{box-shadow:inset 0 0 0 1px var(--primary)}
.plc.sel{border-top-color:var(--primary);border-right-color:var(--primary);border-bottom-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.plb{font-size:11.5px;letter-spacing:.3px;padding:3px 10px}
/* 8. Táctil: objetivos de 44px */
button{height:44px;min-height:44px}
.tonal,.tonal.mini{height:44px}
.mini{height:44px;padding:0 14px;font-size:13px}
.chip{height:44px;padding:0 16px;border-radius:22px}
.arrow{width:44px;height:44px}
.plx{width:44px;height:44px}
.apoin{height:44px}
.chk{gap:8px;padding:6px 8px;top:-20px}
.chk input{width:22px;height:22px}
.snack{font-weight:500}
/* 7. Modo oscuro */
@media (prefers-color-scheme:dark){
  :root{--sh:0 1px 2px rgba(0,0,0,.5),0 2px 8px 1px rgba(0,0,0,.3)}
  .aviso{border-left-color:#FDE293;background:#4A3B12}
  .xt tr.rz td:not(.xg){background:rgba(138,180,248,.18)}
  .xn:not(.nz){opacity:.7}
  .plb{color:var(--on-surface)}
  .tp-CIRC{background:rgba(138,180,248,.22)}
  .tp-ELI{background:rgba(129,201,149,.22)}
  .tp-INC{background:rgba(253,214,99,.22)}
  .tp-APR{background:rgba(242,139,130,.22)}
  .plc.tc-CIRC{border-left-color:#8AB4F8}
  .plc.tc-ELI{border-left-color:#81C995}
  .plc.tc-INC{border-left-color:#FDD663}
  .plc.tc-APR{border-left-color:#F28B82}
  .tonal.mini{border-color:var(--outline)}
}
</style>
</head>
<body>
<header>Despacho <small>v8.0</small><span id="hdInfo"></span></header>
<main>
  <section class="card">
    <div class="field"><label for="despachador">Despachador</label><textarea id="despachador" rows="1"></textarea></div>
    <div class="row" style="justify-content:flex-start"><button class="text" id="limpiarDesp"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg>Limpiar</button></div>
  </section>
  <section class="card">
    <div class="field"><label for="plantilla">Ingresa la plantilla</label><textarea id="plantilla" rows="1"></textarea></div>
    <div class="acc">
      <button class="ab pri" id="pegar"><svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0S9.6.84 9.18 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 18H5V4h2v3h10V4h2z"/></svg><span>Pegar</span></button>
      <button class="ab" id="copiarPl"><svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11z"/></svg><span>Copiar</span></button>
      <button class="ab dng" id="limpiar"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg><span>Limpiar</span></button>
      <button class="arrow" id="plTog" aria-label="Mostrar u ocultar plantilla"><svg viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button>
    </div>
  </section>
  <section class="card" id="campos"></section>
  <div class="divider" id="divCierre">Cierre de incidente</div>
  <section class="card" id="cierre"></section>
  <section class="card" id="filaCard" hidden></section>
  <section class="card" id="eliteCard" hidden>
    <div class="row" style="margin-top:0;justify-content:flex-start"><button class="tonal" id="eliteBtn">Llenar élite</button></div>
    <div id="eliteVista"></div>
  </section>
  <section class="card" id="resultado" hidden></section>
</main>
<div class="snack" id="snack"></div>

<script>
var flot=null;
const flotOn=()=>!!flot&&!flot.closed;
const $=id=>(flotOn()&&flot.document.getElementById(id))||document.getElementById(id);
const WARN='<svg viewBox="0 0 24 24"><path d="M1 21h22L12 2zm12-3h-2v-2h2zm0-4h-2v-4h2z"/></svg>';
const ICON='<svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11z"/></svg>';
const rCirc=/PLANTILLA CIRCULAR|CIRCULAR\s*(?:N\W{0,3}\s*)?0*2{2,3}\s*[-\/]\s*2026/;
const esCircT=n=>rCirc.test(n);
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const auto=t=>{if(t.classList.contains('col')){t.style.height='';return}t.style.height='auto';t.style.height=t.scrollHeight+2+'px'};
function snack(m){const s=$('snack');s.textContent=(/^(Copiado|Pegado|Plantilla|Despachador)/.test(m)?'✓  ':'')+m;s.classList.add('on');clearTimeout(snack.t);snack.t=setTimeout(()=>s.classList.remove('on'),1800)}

function bloque(host,id,label){
  host.insertAdjacentHTML('beforeend',`<div class="field"><label for="${id}">${label}</label><textarea id="${id}" rows="1"></textarea></div>
  <div class="row"><button class="tonal" data-copy="${id}">${ICON}Copiar</button></div>`);
}
[['tipo','Tipo de incidente'],['detalle','Detalle de incidente'],['direccion','Dirección']].forEach(c=>bloque($('campos'),...c));
$('campos').insertAdjacentHTML('afterbegin','<div id="incSel" hidden></div>');
$('incSel').addEventListener('click',e=>{const b=e.target.closest('[data-inc]');if(!b)return;guardaSel();incSel=+b.dataset.inc;incMostrar();incPintar();filaRender()});
bloque($('cierre'),'narracion','Narración de hechos');
bloque($('filaCard'),'fila','Fila para Excel');
$('fila').hidden=true;$('fila').insertAdjacentHTML('afterend','<div id="filaGrid" class="xgrid"></div>');
$('filaCard').insertAdjacentHTML('afterbegin','<div class="field"><label for="recurso">Recurso que atiende incidente</label><input id="recurso" type="text" autocomplete="off" inputmode="text" style="width:100%;box-sizing:border-box;min-height:56px;background:transparent;color:var(--on-surface);border:1px solid var(--outline);border-radius:4px;padding:16px 52px 16px 16px;font:inherit;font-size:16px;text-transform:uppercase"><button class="arrow" id="recTog" aria-label="Mostrar unidades guardadas" style="position:absolute;right:6px;top:6px"><svg viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button></div><div id="recLista" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px" hidden></div>');
$('fila').parentElement.style.marginTop='24px';
/* Unidades: las de siempre + las nuevas que se escriban (se guardan en este navegador) */
const REC0=['3963','3464','2046','1876','3703','3864','2934'];
const recLoad=()=>{try{const a=JSON.parse(localStorage.getItem('recursos')||'[]');return Array.isArray(a)?a.filter(x=>typeof x==='string'&&x):[]}catch(e){return[]}};
const recSave=a=>{try{localStorage.setItem('recursos',JSON.stringify(a))}catch(e){}};
function recPintar(){
  const cu=recLoad().filter(x=>!REC0.includes(x)),sel=$('recurso').value.trim().toUpperCase();
  const e=t=>String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  $('recLista').innerHTML=REC0.map(x=>`<button class="chip${x===sel?' sel':''}" data-rec="${e(x)}">${e(x)}</button>`).concat(cu.map(x=>`<button class="chip${x===sel?' sel':''}" data-rec="${e(x)}">${e(x)}<span class="x" data-del="${e(x)}" aria-label="Quitar">×</span></button>`)).join('');
}
$('recTog').onclick=()=>{const o=$('recLista');o.hidden=!o.hidden;$('recTog').classList.toggle('abierto',!o.hidden);if(!o.hidden)recPintar()};
$('recLista').addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');
  if(d){recSave(recLoad().filter(x=>x!==d.dataset.del));if($('recurso').value.trim().toUpperCase()===d.dataset.del){$('recurso').value='';filaRender()}recPintar();return}
  const b=e.target.closest('[data-rec]');if(!b)return;
  $('recurso').value=b.dataset.rec;filaRender();$('recLista').hidden=true;$('recTog').classList.remove('abierto');
});
$('recurso').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase();filaRender();if(!$('recLista').hidden)recPintar()});
$('recurso').addEventListener('change',e=>{const v=e.target.value.trim().toUpperCase();e.target.value=v;if(v&&!REC0.includes(v)&&!recLoad().includes(v))recSave(recLoad().concat(v));if(!$('recLista').hidden)recPintar()});
$('filaGrid').addEventListener('input',()=>{$('fila').value=[...$('filaGrid').querySelectorAll('tr')].slice(1).map(tr=>[...tr.querySelectorAll('td')].map(td=>td.textContent.replace(/[\t\r\n]+/g,' ').trim().toUpperCase()).join('\t')).join('\n')});
$('resultado').insertAdjacentHTML('beforeend','<div id="xlsWrap" hidden><div class="field"><label>Excel</label><div id="xlsGrid" class="xgrid"></div></div><div class="row"><button class="tonal" data-copy="excel">'+ICON+'Copiar</button></div><textarea id="excel" hidden></textarea></div>');
$('xlsGrid').addEventListener('input',()=>{$('excel').value='\n'.repeat(11)+[...$('xlsGrid').querySelectorAll('[data-i]')].map(td=>td.textContent.trim()).join('\n')});
bloque($('resultado'),'salida','Resultado');

const SIN={

  lugar:['LUGAR','LUGAR DEL DECOMISO','LUGAR DE DECOMISO','LUGAR DECOMISO','LUGAR HABITA','LUGR HABITA','LUGAR HABITACION','LUGAR EXACTO'],
  nombre:['IMPUTADO','NOMBRE IMPUTADO','NOMBRE DEL IMPUTADO','NOMBRE','NOMBRE COMPLETO'],
  cedula:['CEDULA','CEDULA IMPUTADO','CEDULA DEL IMPUTADO','CED'],
  cantidad:['CANTIDAD','TIPO DE DECOMISO','TIPO DE DROGA','DROGA'],
  delito:['TIPO Y DELITO','TIPO DELITO','DELITO'],
  tipoAp:['TIPO'],
  bebida:['BEBIDA ALCOHOLICA','BEBIDA','LICOR'],
  hechos:['DESCRIPCION DE LOS HECHOS','DESCRIPCION DE HECHOS','DESCRIPCION'],
  of1:['OFICIAL ACTUANTE','OFICIAL','OFICIAL RESPONSABLE','OFICIAL A CARGO','ACTUANTE'],
  of2:['OFICIAL ASISTENTE','ASISTENTE'],
  ofs:['OFICIALES','OFICIALES ACTUANTES','OFICIALES ACTUANTE Y ASISTENTE'],
  movil:['MOVIL','UNIDAD','PATRULLA','RECURSO'],
  _otro:['DECOMISO','CARACTERISTICAS','DIRECCION','NACIMIENTO','FECHA DE NACIMIENTO','FECHA NACIMIENTO','GRUPO','NACIONALIDAD','EXPEDIENTE','JUZGADO','CANTON','DISTRITO','CEDULA OFICIAL ACTUANTE','CEDULA OFICIAL ASISTENTE']
};
const MAPA={};for(const k in SIN)SIN[k].forEach(a=>MAPA[a]=k);
const DROGAS=['MARIHUANA','COCAINA','CRACK','HEROINA','METANFETAMINA','PASTA BASE','HACHIS','EXTASIS','LSD','ANFETAMINA','TUSI','WAX'];

function limpiaLinea(l){
  return l.replace(/[\u2060\u200B\u200C\u200D\uFE0F]/g,'').replace(/\*/g,'')
    .replace(/^[\s•·\-–—_>]+/,'').replace(/^[^\p{L}\p{N}]+/u,'').trim();
}
function leer(texto){
  const v={};let act=null;
  for(const raw of texto.split(/\r?\n/)){
    const l=limpiaLinea(raw);if(!l)continue;
    const m=l.match(/^([^:：]{1,40}?)\s*[:：]\s*(.*)$/);
    let campo,resto;
    if(m&&MAPA[norm(m[1])]){campo=MAPA[norm(m[1])];resto=m[2]}
    else if(MAPA[norm(l)]){campo=MAPA[norm(l)];resto=''}
    else if(act==='hechos'||act==='delito'){v[act]+=(act==='hechos'?'\n':' ')+l;continue}
    else if(m){act=null;continue}
    else{if(act)v[act]=((v[act]||'')+(act==='ofs'?'\n':' ')+l).trim();continue}
    if(campo!=='_otro'&&v[campo]){act=null;continue}
    act=campo==='_otro'?null:campo;
    if(act){v[act]=v[act]||'';if(resto.trim())v[act]=resto.trim()}
  }
  return v;
}
function fmtFecha(s=''){
  const m=s.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/);if(!m)return s.trim();
  let y=m[3];if(y.length===2)y='20'+y;return m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0')+'-'+y;
}
function fmtHora(s=''){
  const m=s.match(/(\d{1,2})\s*[:.]\s*(\d{2})\s*([AP])?\.?\s*M?/i);if(!m)return s.trim();
  let h=+m[1];const ap=(m[3]||'').toUpperCase();
  if(ap==='P'&&h<12)h+=12;if(ap==='A'&&h===12)h=0;
  return String(h).padStart(2,'0')+':'+m[2];
}
function fmtCantidad(s=''){
  let t=norm(s).replace(/\bDE APARENTE DROGA\b|\bAPARENTE DROGA\b|\bAPARENTE\b|\bDROGA\b/g,' ').replace(/\s+/g,' ').trim();
  const d=DROGAS.find(x=>t.includes(x));
  if(!d)return t;
  let item=t.replace(d,' ').replace(/\s+/g,' ').trim().replace(/\bDE$/,'').replace(/^DE\b/,'').trim();
  return item?item+' DE '+d:d;
}

/* ---------- Plantilla de incidente con varios bloques: DROGAS -> ARMAS -> CONTRAVENCIONES ---------- */
const joinY=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' Y '+a[a.length-1];
function leerIncidente(txt){
  const cl=txt.split(/\r?\n/).map(limpiaLinea);
  const isT=l=>/^TIPO( DE DROGA)?:?$/.test(norm(l));
  const cab=l=>{const m=l.match(/^([^:：]{1,40}?)\s*[:：]/);return m?(MAPA[norm(m[1])]||''):''};
  const esCab=l=>{const k=cab(l);return !!k&&k!=='bebida'};
  let first=cl.findIndex(isT),end,libre=false;
  if(first>=0){end=cl.findIndex((l,i)=>i>first&&esCab(l));if(end<0)end=cl.length}
  else{
    /* Sin rótulo TIPO: texto libre justo antes de NOMBRE (p. ej. "DECOMISO ARMA BLANCA 9.1 CM") */
    const iN=cl.findIndex(l=>['nombre','cedula','of1','of2'].includes(cab(l)));if(iN<0)return null;
    let j=iN-1;while(j>=0&&!cl[j])j--;end=j+1;
    while(j>=0&&cl[j]&&!esCab(cl[j]))j--;
    first=j+1;if(first>=end)return null;libre=true;
  }
  const v=leer(cl.slice(0,first).concat(cl.slice(end)).join('\n'));
  const up=x=>(x||'').toUpperCase().replace(/\s+/g,' ').trim();
  const dr={},ord=[],arm={BLANCA:[],FUEGO:[],ARMA:[]},con=[];
  const vis=id=>{if(!ord.includes(id))ord.push(id)};
  let cur=libre?{k:'T'}:null;
  const lim=l=>up(l).replace(/^(SE\s+)?DECOMIS(O|A|ADO)\s+(DE\s+)?(UN\s+|UNA\s+)?/,'');
  for(const l of cl.slice(first,end)){
    if(!l)continue;const n=norm(l);
    if(/^TIPO DE DROGA:?$/.test(n)){cur={k:'D',n:'',it:[]};continue}
    if(/^TIPO:?$/.test(n)){cur={k:'T'};continue}
    if(!cur)continue;
    if(cur.k==='D'){
      if(!cur.n&&!/^\d/.test(n)){cur.n=n;dr[n]=dr[n]||[];vis('DROGA');continue}
      if(cur.n)dr[cur.n].push(n);continue}
    /* Detección dinámica por palabras clave: arma blanca / arma de fuego / arma / droga / contravención */
    const R_BL=/\bARMAS?\s+BLANCAS?\b|CUCHILLO|NAVAJA|MACHETE|PUNZON|PUNZOCORTANTE|TIJERA|CUCHILLA|HACHA\b|BAYONETA|CORTAPLUMAS|DESTORNILLADOR/;
    const R_FU=/\bARMAS?\s+(DE\s+)?FUEGO\b|PISTOLA|REVOLVER|ESCOPETA|FUSIL|RIFLE|SUBAMETRALLADORA|CARABINA|HECHIZA/;
    if(R_BL.test(n)){arm.BLANCA.push(lim(l));vis('BLANCA');continue}
    if(R_FU.test(n)){arm.FUEGO.push(lim(l));vis('FUEGO');continue}
    if(/\bARMAS?\b/.test(n)){arm.ARMA.push(lim(l));vis('ARMA');continue}
    if(!/^CONTRAVENCION/.test(n)){
      const d=DROGAS.find(x=>n.includes(x));
      if(d){const it=norm(lim(l)).replace(d,' ').replace(/\bDE APARENTE DROGA\b|\bAPARENTE DROGA\b|\bDROGAS?\b/g,' ').replace(/\s+/g,' ').trim().replace(/\bDE$/,'').replace(/^DE\b/,'').trim();(dr[d]=dr[d]||[]).push(it);vis('DROGA');continue}
      if(/\bDROGAS?\b|ESTUPEFACIENTE|PSICOTROPIC|SUSTANCIA/.test(n)){const it=norm(lim(l)).replace(/\bDE APARENTE DROGA\b|\bAPARENTE DROGA\b|\bDROGAS?\b|ESTUPEFACIENTES?|PSICOTROPICOS?|SUSTANCIAS?( ILICITAS?)?/g,' ').replace(/\s+/g,' ').trim().replace(/\bDE$/,'').replace(/^(DE|TIPO)\b/,'').trim();(dr['DROGA']=dr['DROGA']||[]).push(it);vis('DROGA');continue}
    }
    if(/^CONTRAVENCION|LICOR|BEBIDA|ALCOHOL|CERVEZA|GUARO|ALTERACION|ALTERANDO|ESCANDALO|DESORDEN|OFENSA|OFENDIENDO|IRRESPET|INSULT/.test(n)){
      const id=/LICOR|BEBIDA|ALCOHOL|CERVEZA|GUARO/.test(n)?'LICOR':/ALTERACION|ALTERANDO|ESCANDALO|DESORDEN/.test(n)?'ALTER':/OFENSA|OFENDIENDO|IRRESPET|INSULT/.test(n)?'OFENSA':'CONTRA:'+up(l);
      const std=id==='LICOR'?'CONTRAVENCION POR CONSUMO DE LICOR EN VIA PUBLICA':id==='ALTER'?'CONTRAVENCION POR ALTERACION AL ORDEN PUBLICO':id==='OFENSA'?'CONTRAVENCION POR OFENSAS A LA AUTORIDAD':up(l);
      const t=/^CONTRAVENCION/.test(n)?up(l):std;
      con.push({t,b:'',id});vis(id);continue}
    const mb=l.match(/^BEBIDA[^:]*:\s*(.*)$/i);if(mb&&con.length){con[con.length-1].b=up(mb[1])}
  }
  const nom=up(v.nombre),ced=(v.cedula||'').replace(/[^\dA-Za-z]/g,'').toUpperCase();
  const base=[];if(nom)base.push(nom);if(ced)base.push('CEDULA '+ced);
  const lugar=up(v.lugar),f=fmtFecha(v.fecha),h=fmtHora(v.hora);
  const mk=(id,et,tipo,tail,sitD)=>{
    const det=[...base,tail].filter(Boolean).join(' ');
    const q=[...base,tail].filter(Boolean);if(lugar)q.push('ESTO EN '+lugar);
    let nar=q.join(' ');if(h||f)nar+=(nar?'. ':'')+'AL SER LAS '+(h||'')+' HORAS DEL '+(f||'');
    return{id,et,tipo,det,nar,sitD:sitD||''};
  };
  const incs=[];
  for(const id of ord){
    if(id==='DROGA'){
      const ks=Object.keys(dr).filter(k=>dr[k].length);
      const gen=k=>k==='DROGA';
      const g=ks.map(k=>gen(k)?(joinY(dr[k].filter(Boolean))?joinY(dr[k].filter(Boolean))+' DE APARENTE DROGA':'APARENTE DROGA'):(joinY(dr[k].filter(Boolean))?joinY(dr[k].filter(Boolean))+' DE '+k:k));
      const gs=ks.map(k=>gen(k)?(joinY(dr[k].filter(Boolean))?joinY(dr[k].filter(Boolean))+' DE APARENTE DROGA':'APARENTE DROGA'):(joinY(dr[k].filter(Boolean))?joinY(dr[k].filter(Boolean))+' DE APARENTE DROGA '+k:'APARENTE DROGA '+k));
      if(g.length)incs.push(mk(id,'DROGA','DECOMISO DE DROGA','PORTA '+joinY(g),['SE LE DECOMISA A',...base,joinY(gs)].join(' ')));
    }else if(id==='BLANCA')incs.push(mk(id,'ARMA BLANCA','DECOMISO DE ARMA BLANCA','PORTA '+arm.BLANCA.join(' Y ')));
    else if(id==='FUEGO')incs.push(mk(id,'ARMA DE FUEGO','DECOMISO DE ARMA DE FUEGO','PORTA '+arm.FUEGO.join(' Y ')));
    else if(id==='ARMA')incs.push(mk(id,'ARMA','DECOMISO DE ARMA','PORTA '+arm.ARMA.join(' Y ')));
    else if(id==='LICOR'){const cs=con.filter(c=>c.id==='LICOR'),b=cs.map(c=>c.b).filter(Boolean);incs.push(mk(id,'LICOR',cs[0].t,'CONSUMIENDO '+(b.length?b.join(' Y '):'BEBIDA ALCOHOLICA')))}
    else if(id==='ALTER'){const c=con.find(c=>c.id===id);incs.push(mk(id,'ALTERACIÓN',c.t,'ALTERANDO EL ORDEN PÚBLICO'))}
    else if(id==='OFENSA'){const c=con.find(c=>c.id===id);incs.push(mk(id,'OFENSAS',c.t,'OFENDIENDO A LA AUTORIDAD'))}
    else{const c=con.find(c=>c.id===id);incs.push(mk(id,'CONTRAVENCIÓN',c.t,'INCURRIENDO EN '+c.t))}
  }
  return{v,incs,lugar};
}
let incs=[],incSel=0,incKey='';

function incMostrar(){const i=incs[incSel];if(!i)return;$('tipo').value=i.tipo;$('detalle').value=i.det;$('narracion').value=i.nar;['tipo','detalle','narracion'].forEach(x=>auto($(x)))}

let lastEsp='';
/* Divisor entre plantillas pegadas: se ve en el cuadro pero los lectores lo ignoran */
const SEPRE=/^[ \t]*▬{3,}.*$/gm;
let store=[],sel=-1,abierto=false,curTxt='',curList=[];
function agregarPl(t){t=(t||'').toUpperCase().trim();if(!t)return false;store.push({t});sel=store.length-1;abierto=false;return true}
/* Grupos que se suman: C=circulares, K=cortes de control/élite nuevo, E=élite anterior. El resto (drogas, incidentes, aprehensiones) va individual */
function grupoPl(t){
  const n=norm(t);
  if(esCircT(n))return'C';
  if(/ABORDAJES/.test(n)&&/DECOMISOS/.test(n)||/CORTE DE CONTROL/.test(n))return'K';
  if(/ELITE/.test(n))return'E';
  return null;
}
const GN={C:'circulares',K:'cortes',E:'élites'};
function efectivo(){
  if(sel<0||!store[sel])return[];
  const g=grupoPl(store[sel].t);
  return g?store.filter(x=>grupoPl(x.t)===g).map(x=>x.t):[store[sel].t];
}
function tipoPl(t){
  const n=norm(t);
  if(esCircT(n))return['CIRCULAR','CIRC'];
  if(/ABORDAJES/.test(n)&&/DECOMISOS/.test(n))return[/DELEGACIONES/.test(n)?'CORTE ÉLITE':'CORTE DE CONTROL','ELI'];
  if(/CORTE DE CONTROL/.test(n))return['CORTE DE CONTROL','ELI'];
  if(/ELITE/.test(n))return['ÉLITE','ELI'];
  if(/APREHENSION/.test(n))return['APREHENSIÓN','APR'];
  if(/DROGA|MARIHUANA|COCAINA|CRACK/.test(n)&&/PLANTILLA DE INCIDENTE/.test(n))return['DROGA','INC'];
  if(/PLANTILLA DE INCIDENTE/.test(n))return['INCIDENTE','INC'];
  return['PLANTILLA','OTR'];
}
function hdRender(){

function plPintar(){

}
let plPrev='';
function plMostrar(){const ver=abierto&&sel>=0&&!!store[sel];pl.value=ver?store[sel].t:'';plPrev=pl.value;plCol(!ver);auto(pl)}
function plTocar(i){if(sel===i)abierto=!abierto;else{sel=i;abierto=true}plMostrar();armar()}
function plNueva(t){const hay=store.length;if(!agregarPl(t))return;plMostrar();armar();snack(hay?'Plantilla agregada':'Pegado')}
function plEditar(){
  /* Pegado por cualquier vía (teclado, menú, sugerencia del teclado): entra un bloque grande de golpe -> tarjeta nueva y cuadro limpio */
  {const cur=pl.value,prev=plPrev,m=Math.min(prev.length,cur.length);let i=0,j=0;
   while(i<m&&prev[i]===cur[i])i++;
   while(j<m-i&&prev[prev.length-1-j]===cur[cur.length-1-j])j++;
   const chunk=cur.slice(i,cur.length-j);
   if(chunk.length>=20&&chunk.trim()){pl.value=prev;plNueva(chunk);return}}
  if(sel<0||!abierto||!store[sel]){if(!pl.value.trim())return;store.push({t:pl.value});sel=store.length-1;abierto=true}
  else store[sel].t=pl.value;

}
const filtrarN=()=>curList.length>1?curList.map(filtrar).join('\n\n'):filtrar(curTxt);

    return}

    incs=mi.incs;incMostrar();lastLugar=mi.lugar;dirRender();incPintar();

  incKey='';incPintar();
  const v=leer(txt);

  const esArma=!apre&&!esLicor&&/\bARMAS?\b/.test(tn);
  const esDroga=!apre&&!esLicor&&!esArma&&(!!cant||/DROGA|MARIHUANA|COCAINA|CRACK|HEROINA/.test(norm(txt)));
  const base=[];if(nom)base.push(nom);if(ced)base.push('CEDULA '+ced);

  if(apre){
    const t=up(v.tipoAp),d=up(v.delito);

      col[r]=String(Math.round(((parseFloat(col[r])||0)+parseFloat(m[1].replace(',','.')))*1000)/1000);hit=true;
    }
    if(!hit)sobra.push(raw.trim());
  }
  return sobra;
}
const sumar=(col,r,n)=>{const q=parseFloat(String(n).replace(',','.'))||0;if(q>0)col[r]=String(Math.round(((parseFloat(col[r])||0)+q)*1000)/1000)};
const TBL=[["Aprehensiones por contravencion", ["Contra las personas", "Contra la propiedad y el patrimonio", "Contra el orden publico", "Contra las buenas costumbres", "Contra inviolab. Terrenos", "Contra seguridad publica"]], ["Detenidos por comision de delitos- ANOTAR CANTIDAD DE LA JORNADA  Y Anotar los datos de cada uno en el cuadro de abajo)", [""]], ["Aprehendidos por migracion", ["Residente", "Citas", "Decomisos de pasaporte", "Rechazos", "Aprehensiones por migracion"]], ["Decomisos de armas blancas", ["Punzocortantes"]], ["Decomisos de armas de fuego", ["Pistola balines"]], ["Armas no letales", ["Pistola balas de goma", "Rifle de copas", "Armas de imitacion"]], ["Armas de fuego", ["Pistola", "Revolver", "Arma larga", "Escopeta", "Subametralladora", "Hechizas"]], ["Municion", ["Balas", "Cargadores"]], ["Polvora", ["Fuegos artificiales", "Otro tipo"]], ["Decomiso de automoviles", ["Por OIJ o denuncia de robo", "Por policia de Transito", "Por piques", "Recuperado (Hallazgo)", "Solo boletas de transito", "Boletas y placas decomisadas"]], ["Decomiso de motocicletas", ["Por OIJ o denuncia de robo", "Por policia de Transito", "Por piques", "Recuperado (Hallazgo)", "Solo boletas de transito", "Boletas y placas decomisadas"]], ["Decomiso de droga marihuana", ["Gramos", "Kilos", "Cigarros", "Puchos", "Tocolas", "Plantas", "Semillas"]], ["Decomiso de cocaina", ["Gramos", "Kilos", "Puntas"]], ["Decomiso de crack", ["Gramos", "Piedras"]], ["Decomiso de otras drogas", ["Extasis", "Heroína", "Anfetaminas", "Otras"]], ["Decomiso de animales", ["Bovinos", "Porcinos", "Equinos", "Aves", "Otros (Reptile y anfibios)"]], ["Decomiso de licores", ["Litros", "Pachas", "Botellas", "Latas"]], ["Decomiso de dinero", ["Colones", "Dolares", "Euros", "Otros"]], ["Decomiso de alimentos", ["Pescado kg", "Carne kg", "Queso kg", "Granos"]], ["Decomiso de medicamentos", ["Pastillas", "Cremas", "Jarabes"]], ["Decomiso de madera", ["Tucas/trozos"]], ["Decomiso de mercaderia", ["Ropa/perfumes/zapatos/otros"]], ["Investigados", ["Personas", "Vehiculos", "Motos", "Furgones/camiones", "Agentes de seguridad", "Armas de fuego"]], ["Locales", ["Comerciales clausurados", "Habitacionales clausurados"]], ["Controles de carretera", [""]]];
function xlsRender(x){
  let h='<table class="xt">',i=0;
  TBL.forEach(([g,sub])=>{const solo=sub.length===1&&sub[0]==='';
    sub.forEach((n,j)=>{const v=x.cols[i];
      h+='<tr'+(v!=='0'?' class="rz"':'')+'>'+(j?'':`<td class="xg" rowspan="${sub.length}"${solo?' colspan="2"':''}>${escA(g)}</td>`)+(solo?'':`<td>${escA(n)}</td>`)+`<td class="xn${v!=='0'?' nz':''}" contenteditable="true" inputmode="decimal" data-i="${i}">${escA(v)}</td></tr>`;i++})});
  $('xlsGrid').innerHTML=h+'</table>';
}
function prepCirc(l){
  if(/^(DECOMISOS|APREHENSIONES)$/.test(norm(sinAst(l))))return l.trim()+':';
  const m=l.trim().match(/^([^:：=]{1,60}?[:：=]\s*\*?\s*\d+(?:[.,]\d+)?)\s+(\S[^:：=]{0,60}[:：=].*)$/);
  return m?m[1]+'   '+m[2]:l;
}
function excel(txt){
  const col=Array(FILAS).fill('0'),sin=[],av=[];
  for(const b of bloques(txt.replace(/\r/g,'').split('\n').map(prepCirc))){
    b.ps.forEach((p,i)=>{
      const e=etiqueta(p.t);if(!e)return;
      const k=norm(sinAst(p.t).split(/[:：=]/)[0]).replace(/[^A-Z]+/g,' ').trim();
      const v=sinAst(e.val).trim(),cuerpo=(i===b.ps.length-1?b.body:[]).filter(x=>!vacio(x));
      if(vacio(v)&&!cuerpo.length)return;
      if(k in XLS){let vv=v;if(vacio(vv)&&cuerpo.length){const mm=cuerpo[0].match(/^(\d+(?:[.,]\d+)?)\b/);vv=mm?mm[1]:''}
        if(/^\d+([.,]\d+)?$/.test(vv))sumar(col,XLS[k],vv);else if(vv)col[XLS[k]]=vv;return}
      if(k==='DECOMISOS DE DROGAS'){const so=drogas([v,...cuerpo],col);if(so.length)sin.push(k+': '+so.join(' / '));return}
      if(/^(MARIHUANA|COCAINA|CRACK)$/.test(k)){const so=drogas([v,...cuerpo].filter(Boolean).map(x=>new RegExp(k).test(norm(sinAst(x)))?x:x+' '+k),col);if(so.length)sin.push(k+': '+so.join(' / '));return}
      if(k==='ARMAS NO LETALES'){
        const r=[];cuerpo.forEach(x=>{const q=norm(sinAst(x)),m=q.match(/^(\d+(?:[.,]\d+)?)\s+(.*)$/);
          const f=m&&(/BALIN/.test(m[2])?13:/GOMA/.test(m[2])?14:/COPAS?/.test(m[2])?15:/IMITACION/.test(m[2])?16:0);
          if(f)sumar(col,f,m[1]);else r.push(x)});
        if(!cuerpo.length||!cuerpo.some(x=>/^\d/.test(x)))sumar(col,16,v);
        if(r.length&&cuerpo.length&&cuerpo.some(x=>/^\d/.test(x)))sin.push(k+': '+r.join(' / '));
        return}
      if(k==='ARMAS DE FUEGO'){
        const r=[];cuerpo.forEach(x=>{const q=norm(sinAst(x)),m=q.match(/^(\d+(?:[.,]\d+)?)\s+(.*)$/);
          if(m&&/^ARMAS? BLANCAS?/.test(m[2])&&col[12]!=='0')return;
          const f=m&&(/HECHIZ/.test(m[2])?22:/BALIN/.test(m[2])?13:/PISTOLA/.test(m[2])?17:/REVOLVER/.test(m[2])?18:/ARMA LARGA|FUSIL|RIFLE/.test(m[2])?19:/ESCOPETA/.test(m[2])?20:/SUBAMETRALLADORA/.test(m[2])?21:0);
          if(f)sumar(col,f,m[1]);else r.push(x)});
        if(r.length||(!vacio(v)&&!cuerpo.length))sin.push(k+(vacio(v)?'':': '+v)+(r.length?(vacio(v)?': ':' / ')+r.join(' / '):''));
        return}
      if(k==='REPORTE POLVORA'){sumar(col,25,v);return}
      if(k==='POR CONTRAVENCIONES'){sumar(col,0,v);av.push('POR CONTRAVENCIONES ('+String(+v)+'): la plantilla no dice el tipo. Quedó todo en "Aprehensiones por contravención – Contra las personas". Si fue contra la propiedad, el orden público, las buenas costumbres, inviolabilidad de terrenos o seguridad pública, cámbialo a esa fila en el Excel.');return}
      if(k==='DECOMISOS DE AUTOMOVILES Y MOTOS'){
        let sp=false;cuerpo.forEach(x=>{const q=norm(sinAst(x)),m=q.match(/^(\d+(?:[.,]\d+)?)\s+(.*)$/);
          if(m&&/MOTO/.test(m[2])){sumar(col,33,m[1]);sp=true}else if(m&&/AUTOMOVIL|VEHICULO|CARRO/.test(m[2])){sumar(col,27,m[1]);sp=true}else sin.push(k+': '+x)});
        if(!sp&&!vacio(v)){sumar(col,27,v);av.push('DECOMISOS DE AUTOMÓVILES Y MOTOS ('+String(+v)+'): la plantilla no separa autos y motos ni dice el motivo. Quedó todo en "Decomiso de automóviles – Por OIJ o denuncia de robo". Si son motos, pásalo a "Decomiso de motocicletas – Por OIJ o denuncia de robo"; si fue por tránsito, piques, hallazgo o boletas, cámbialo a esa fila en el Excel.')}
        else if(sp)av.push('DECOMISOS DE AUTOMÓVILES Y MOTOS: el motivo no viene en la plantilla; quedó en "Por OIJ o denuncia de robo". Si fue por tránsito, piques, hallazgo o boletas, cámbialo a esa fila en el Excel.');
        return}
      if(k==='OTRO TIPO DE DECOMISOS'&&cuerpo.length){
        const dl=cuerpo.filter(x=>/MARIHUANA|COCAINA|CRACK|TUSSI|TUSI|KETAMINA|HEROINA|EXTASIS|ANFETAMINA|DOSIS|PUCHO|TOCOLA|CIGARR|PUNTA|PIEDRA/.test(norm(sinAst(x))));
        const ot=cuerpo.filter(x=>!dl.includes(x));if(!vacio(v))ot.unshift(v);
        const so=drogas(dl,col);if(so.length)sin.push(k+': '+so.join(' / '));
        if(ot.length)sin.push(k+': '+ot.join(' / '));
        return}
      if(SIN_FILA.includes(k))return;
      sin.push(k+(v?': '+v:'')+(cuerpo.length?(v?' / ':': ')+cuerpo.join(' / '):''));
    });
  }
  {const g=new Map();av.forEach(t=>{const m=t.match(/^(.*?) \((\d+)\): (.*)$/);const k=m?m[1]+'|'+m[3]:t;const o=g.get(k)||{t,n:0,m:!!m,a:m&&m[1],r:m&&m[3]};if(m)o.n+=+m[2];g.set(k,o)});
  av.splice(0,av.length,...[...g.values()].map(o=>o.m?o.a+' ('+o.n+'): '+o.r:o.t))}
  const fil=col.map((v,i)=>v&&v!=='0'?ETQ[i]+': '+v:'').filter(Boolean);
  /* 11 filas de encabezado del Excel (ministerio ... INDICADORES) quedan en blanco: 11 + 86 = 97 filas */
  return{col:'\n'.repeat(11)+col.join('\n'),cols:col,sin,fil,av};
}

async function copiarTexto(t){
  if(!t||t==='—'){snack('Nada que copiar');return}
  const W=flotOn()?flot:window;
  try{await W.navigator.clipboard.writeText(t)}catch(e){const D=W.document,el=D.createElement('textarea');el.value=t;D.body.appendChild(el);el.select();D.execCommand('copy');D.body.removeChild(el)}
  snack('Copiado');
}
